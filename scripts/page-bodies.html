<template data-page="choosing-a-drone.html" data-title="article_title_1" data-description="article_1_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_1">გზამკვლევი</p><h1 data-i18n="article_title_1">როგორ შევარჩიოთ სასოფლო-სამეურნეო დრონი</h1><p class="page-intro" data-i18n="article_1_intro">დაიწყეთ სამუშაოს მოთხოვნებით — შემდეგ შეარჩიეთ ტექნიკა.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/p150-max-flight.webp" width="2048" height="853" alt="XAG P150 MAX ფრენისას" data-i18n-alt="hero_alt"><div class="article-body">
    <h2 data-i18n="article_1_h1">თქვენი ნაკვეთი და კულტურა</h2><p data-i18n="article_1_p1">შეაფასეთ დასამუშავებელი ფართობი, ნაკვეთის ფორმა, რელიეფი და მისასვლელი გზა. ღია ველი, ვენახი და ბაღი განსხვავებულ დაგეგმვას მოითხოვს. სამუშაო დატვირთვა მხოლოდ ჰექტრების რაოდენობით არ განისაზღვრება.</p>
    <h2 data-i18n="article_1_h2">მთელი სამუშაო პროცესი</h2><p data-i18n="article_1_p2">დრონთან ერთად დაგეგმეთ დამუხტვა, წყლის მიწოდება, ტრანსპორტირება და სამუშაო ჯგუფი. აკუმულატორებისა და დამტენების რაოდენობა უნდა შეესაბამებოდეს რეალურ სამუშაო რეჟიმს.</p>
    <h2 data-i18n="article_1_h3">სერვისი და ნაწილები</h2><p data-i18n="article_1_p3">შეძენამდე გაარკვიეთ, როგორ მიიღებთ ტექნიკურ მხარდაჭერას, რომელი ნაწილებია ხელმისაწვდომი და რას მოიცავს სწავლება. შეადარეთ სრული კომპლექტაციისა და ექსპლუატაციის ხარჯი.</p>
    <h2 data-i18n="article_1_h4">პრაქტიკული დემონსტრაცია</h2><p data-i18n="article_1_p4">კონსულტაციისას აღწერეთ თქვენი კულტურა, ფართობი და სამუშაო ამოცანა. მოითხოვეთ პირობებზე მორგებული შეთავაზება და გადაამოწმეთ დრონის შესაძლებლობები მწარმოებლის დოკუმენტაციით.</p>
    <a class="text-link" href="/consultation.html?topic=drone" data-local><span data-i18n="request_offer">შეთავაზების მოთხოვნა</span><span aria-hidden="true">→</span></a>
  </div></article>
</template>
<template data-page="first-flight.html" data-title="article_title_2" data-description="article_2_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_2">პრაქტიკა</p><h1 data-i18n="article_title_2">როგორ მოვემზადოთ პირველი ფრენისთვის</h1><p class="page-intro" data-i18n="article_2_intro">სწავლება, ტექნიკური შემოწმება და სამუშაოს დაგეგმვა.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/field-ready.webp" width="1280" height="600" alt="სამუშაოდ მომზადებული დრონი სიმინდის ნაკვეთთან" data-i18n-alt="photo_field"><div class="article-body">
    <h2 data-i18n="article_2_h1">გაიცანით თქვენი ტექნიკა</h2><p data-i18n="article_2_p1">გაიარეთ მოდელზე მორგებული პრაქტიკული სწავლება და წაიკითხეთ მწარმოებლის სახელმძღვანელო. წინასწარ გაეცანით მართვის რეჟიმებს, გაფრთხილებებსა და ფრენის შეწყვეტის პროცედურებს.</p>
    <h2 data-i18n="article_2_h2">შეამოწმეთ დრონი</h2><p data-i18n="article_2_p2">მწარმოებლის საკონტროლო სიის მიხედვით შეამოწმეთ ჩარჩო, პროპელერები, აკუმულატორები და შეწამვლის სისტემა. გაუმართავი ან გაფრთხილების მქონე ტექნიკით ფრენა არ დაიწყოთ.</p>
    <h2 data-i18n="article_2_h3">დაათვალიერეთ სამუშაო ადგილი</h2><p data-i18n="article_2_p3">გამოავლინეთ დაბრკოლებები, ელექტროგადამცემი ხაზები და ადამიანების გადაადგილების ზონები. შეაფასეთ ამინდი და სამუშაოს შესაბამისობა მწარმოებლის შეზღუდვებთან და მოქმედ მოთხოვნებთან.</p>
    <h2 data-i18n="article_2_h4">დაგეგმეთ დამუშავება</h2><p data-i18n="article_2_p4">პრეპარატი და გამოყენების ნორმა შეარჩიეთ აგრონომთან და პროდუქტის ეტიკეტის მიხედვით. სწავლებისას შეამოწმეთ სამუშაო პარამეტრები მწარმოებლის ინსტრუქციით. ეს გზამკვლევი პრაქტიკულ სწავლებას არ ცვლის.</p>
    <a class="text-link" href="/consultation.html?topic=academy" data-local><span data-i18n="academy_cta">სწავლების შესახებ</span><span aria-hidden="true">→</span></a>
  </div></article>
</template>

          <details class="faq-item"><summary data-i18n="faq_q1">რა არის შესაწამლი დრონი?</summary><p data-i18n="faq_a1">შესაწამლი დრონი არის სასოფლო-სამეურნეო დრონი, რომელიც ავტომატურად, GPS/RTK მარშრუტით წამლავს ნაკვეთს მცენარეთა დაცვის საშუალებებით. XAG P150 MAX ამასთან ერთად აფანტავს გრანულებს და გადააქვს ტვირთი.</p></details>

<template data-page="batteries-and-charging.html" data-title="article_title_3" data-description="article_3_intro">

    <h2 data-i18n="article_3_h1">რამდენი აკუმულატორი გჭირდებათ</h2><p data-i18n="article_3_p1">დრონი ფრენს, სანამ შემდეგი აკუმულატორი იმუხტება. ფრენისა და დამუხტვის დრო ერთმანეთს უნდა დაემთხვეს, ამიტომ დიდ ფართობზე მეტი აკუმულატორი და დამტენი გჭირდებათ. სწორ რაოდენობას თქვენი ფართობისა და სამუშაო დღის მიხედვით ერთად შევარჩევთ.</p><h2 data-i18n="article_3_h2">ენერგია ველზე</h2><p data-i18n="article_3_p2">ველზე ელექტროენერგია ყოველთვის არ არის. გენერატორი და პარალელური დამუხტვის კომპლექტი საშუალებას გაძლევთ, დატენოთ იქ, სადაც მუშაობთ. გამოიყენეთ მწარმოებლის მიერ რეკომენდებული აღჭურვილობა.</p><h2 data-i18n="article_3_h3">გაგრილება და ტემპერატურა</h2><p data-i18n="article_3_p3">ცხელ დღეს აკუმულატორი ფრენის შემდეგ თბება. დამუხტვამდე გააგრილეთ, მაგალითად გამაგრილებელი კოშკით. ცხელი აკუმულატორის დამუხტვა მის სიცოცხლეს ამცირებს.</p><h2 data-i18n="article_3_h4">შენახვა სეზონებს შორის</h2><p data-i18n="article_3_p4">სეზონის შემდეგ აკუმულატორები შეინახეთ მშრალ, გრილ ადგილას, მწარმოებლის მიერ მითითებული დატენვის დონით. დაზიანებული ან გაბერილი აკუმულატორი აღარ გამოიყენოთ.</p>
