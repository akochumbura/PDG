  <section class="section pm-chapters" id="capabilities" aria-label="შესაძლებლობები" data-i18n-aria="pm_chapters_label"><div class="container">
    <article class="pm-chapter" id="map" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>01</span> RealTerra</p><h2 data-i18n="pm_map_t">რუკის შედგენა</h2><p data-i18n="pm_map_p">ჩაშენებული სისტემა, დამატებითი მოდულის გარეშე: ავტონომიური ფრენისას იღებს მაღალი გარჩევადობის ფოტოებს, აერთიანებს ნაკვეთის რუკად და დაჯდომისთანავე გაძლევთ. ხელოვნური ინტელექტი თავად ცნობს დაბრკოლებებს, მთიან რელიეფზე ჩანს 3D მოდელი, ხოლო პრესკრიფციული რუკებით შესაძლებელია ცვლადი ნორმით შეწამვლა და გაფანტვა.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_map">რუკა ერთ ფრენაზე</dt><dd><span class="pm-num">30</span> <span class="pm-unit" data-i18n="u_ha">ჰა</span></dd></div><div><dt data-i18n="pm_f_3d">მოდელი მთიანი რელიეფისთვის</dt><dd><span class="pm-num">3D</span></dd></div><div><dt data-i18n="pm_f_vra">ცვლადი ნორმა რუკით</dt><dd><span class="pm-num">VRA</span></dd></div></dl></article>
    <article class="pm-chapter" id="spray" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>02</span> RevoSpray 5</p><h2 data-i18n="pm_spray_t">შეწამვლა</h2><p data-i18n="pm_spray_p">ინტელექტუალური ცენტრიდანული საქშენები და ორი იმპელერიანი ტუმბო ზუსტად ანაწილებს ხსნარს. ოთხი როტორის ძლიერი ჰაერის ნაკადი წვეთებს ხშირ ვარჯში ატარებს. 4-საქშენიანი განახლების კომპლექტით (იყიდება ცალკე) ხარჯი 46 ლ/წთ-მდე იზრდება — რეკომენდებულია ბაღებისა და ვენახებისთვის.</p><p class="pm-more"><a class="text-link" href="/shop?q=05-002-02640#parts" data-local data-i18n="pm_nozzle_link">4-საქშენიანი განახლების კომპლექტი მაღაზიაში</a></p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_tank">ხსნარის ავზი</dt><dd><span class="pm-num">80</span> <span class="pm-unit" data-i18n="u_l">ლ</span></dd></div><div><dt data-i18n="pm_f_flow">ხარჯი, ორი ტუმბო</dt><dd><span class="pm-num">32</span> <span class="pm-unit" data-i18n="u_lmin">ლ/წთ</span></dd></div><div><dt data-i18n="pm_f_flow4">4-საქშენიანი კომპლექტით</dt><dd><span class="pm-num">46</span> <span class="pm-unit" data-i18n="u_lmin">ლ/წთ</span></dd></div><div><dt data-i18n="pm_f_drop">წვეთის ზომა</dt><dd><span class="pm-num">60–1500</span> <span class="pm-unit" data-i18n="u_um">მკმ</span></dd></div><div><dt data-i18n="pm_f_swath">შეწამვლის სიგანე</dt><dd><span class="pm-num">5–10</span> <span class="pm-unit" data-i18n="u_m">მ</span></dd></div></dl></article>
    <article class="pm-chapter" id="spread" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>03</span> RevoCast 5</p><h2 data-i18n="pm_spread_t">გრანულების გაფანტვა</h2><p data-i18n="pm_spread_p">ვერტიკალური რხევითი გამფანტველი პირდაპირი ამძრავით ქარშიც თანაბრად ანაწილებს მასალას. სამი ზომის ხრახნიანი მიმწოდებელი იღებს 10 მმ-მდე გრანულებს: სასუქს, თესლს, საკვებს. კონტეინერი ორივე მხრიდან ივსება. RevoCast 5 დამატებითი მოდულია და იყიდება ცალკე.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_hopper">გრანულების კონტეინერი</dt><dd><span class="pm-num">115</span> <span class="pm-unit" data-i18n="u_l">ლ</span></dd></div><div><dt data-i18n="pm_f_rate">მაქს. გაფანტვა*</dt><dd><span class="pm-num">300</span> <span class="pm-unit" data-i18n="u_kgmin">კგ/წთ</span></dd></div><div><dt data-i18n="pm_f_spw">ეფექტური სიგანე</dt><dd><span class="pm-num">9</span> <span class="pm-unit" data-i18n="u_m">მ</span></dd></div><div><dt data-i18n="pm_f_gran">მაქს. გრანულა</dt><dd><span class="pm-num">10</span> <span class="pm-unit" data-i18n="u_mm">მმ</span></dd></div></dl></article>
    <article class="pm-chapter" id="cargo" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>04</span> RevoSling</p><h2 data-i18n="pm_cargo_t">ტვირთის გადატანა</h2><p data-i18n="pm_cargo_p">სასოფლო-სამეურნეო მასალის, მოსავლის, ჩითილებისა და ნერგების მიტანა ძნელად მისადგომ ადგილებში. ტვირთის საიმედო საკეტი ავტომატური გაშვებით, A/B მარშრუტი, ინდივიდუალური ტრასა მთიან რელიეფზე და წონის გაზომვა ფრენისას. RevoSling დამატებითი სისტემაა და იყიდება ცალკე.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_payload">მაქს. ტვირთი</dt><dd><span class="pm-num">80</span> <span class="pm-unit" data-i18n="u_kg">კგ</span></dd></div><div><dt data-i18n="pm_f_slingspeed">მაქს. სიჩქარე ტვირთით</dt><dd><span class="pm-num">13.8</span> <span class="pm-unit" data-i18n="u_ms">მ/წმ</span></dd></div></dl></article>
    <article class="pm-chapter" id="flight" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>05</span> SuperX 5 Ultra</p><h2 data-i18n="pm_flight_t">ფრენა და უსაფრთხოება</h2><p data-i18n="pm_flight_p">4D გამოსახულების რადარი დღისით და ღამით ხედავს ბოძებს, მავთულებს, მორწყვის დანადგარებს და სხვა დაბრკოლებებს. რელიეფის მიყოლა წინასწარი რუკის გარეშე — დრონი 3D რუკას ფრენისას აგებს. ფართოკუთხიანი FPV კამერა დაბრკოლებებს AR ნიშნებით აჩვენებს და საეჭვო სიტუაციაში დრონი ჰაერში ჩერდება.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_speed">მაქს. ფრენის სიჩქარე</dt><dd><span class="pm-num">20</span> <span class="pm-unit" data-i18n="u_ms">მ/წმ</span></dd></div><div><dt data-i18n="pm_f_radar">რადარის მანძილი</dt><dd><span class="pm-num">1.5–100</span> <span class="pm-unit" data-i18n="u_m">მ</span></dd></div><div><dt data-i18n="pm_f_cpu">გამოთვლითი სიმძლავრე SuperX 5 Pro-სთან შედარებით</dt><dd><span class="pm-num">2.5×</span></dd></div></dl></article>
    <article class="pm-chapter" id="power" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>06</span> B141050 · CM13600S · GC4000+</p><h2 data-i18n="pm_power_t">ენერგია და დამუხტვა</h2><p data-i18n="pm_power_p">1050 ვტ·სთ აკუმულატორი (გარანტია — 1 წელი ან 1500 ციკლი). ერთი CM13600S დამტენით 30%-დან 95%-მდე დაახლოებით 12 წუთში, პარალელური კომპლექტით — 7 წუთში. ნისლით გამაგრილებელი ავზი ერთი შევსებით 6–8 საათს მუშაობს, ხოლო GC4000+ გენერატორი მინდორზე დამოუკიდებლად გამუშავებთ. ერთი აკუმულატორის რეჟიმი: 50 ლ ხსნარი ან 40 კგ გრანულა.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_f_wh">აკუმულატორის ტევადობა</dt><dd><span class="pm-num">1050</span> <span class="pm-unit" data-i18n="u_wh">ვტ·სთ</span></dd></div><div><dt data-i18n="pm_f_charge">დამუხტვა 30→95%, პარალელურად</dt><dd><span class="pm-num">7</span> <span class="pm-unit" data-i18n="u_min">წთ</span></dd></div><div><dt data-i18n="pm_f_kw">დამტენის სიმძლავრე</dt><dd><span class="pm-num">3.4</span> <span class="pm-unit" data-i18n="u_kw">კვტ</span></dd></div></dl></article>
    <article class="pm-chapter" id="build" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>07</span> XAG One · SRC 5 · XRTK 7</p><h2 data-i18n="pm_build_t">კონსტრუქცია და მართვა</h2><p data-i18n="pm_build_p">IPX6K დაცვა — დრონი წყლით ირეცხება. 63-დიუმიანი პროპელერები, დასაკეცი მკლავები და მოდულური კონსტრუქცია ტრანსპორტირებისთვის. XAG One აპლიკაციაში: მარშრუტი ნაკვეთის ფორმით, 10-მდე ნაკვეთი ერთ მისიაში, ორი დრონის ერთდროული მართვა და ავტომატური დაბრუნება, როცა ხსნარი ან ენერგია მთავრდება. SRC 5 პულტი: 7 დიუმიანი კაშკაშა ეკრანი, 8 საათი მუშაობა. სანტიმეტრული სიზუსტისთვის — XRTK 7 მობილური სადგური.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_f_ip">დაცვის კლასი</dt><dd><span class="pm-num">IPX6K</span></dd></div><div><dt data-i18n="pm_f_prop">პროპელერი</dt><dd><span class="pm-num">63</span> <span class="pm-unit" data-i18n="u_in">დიუმი</span></dd></div><div><dt data-i18n="pm_f_fields">ნაკვეთი ერთ მისიაში</dt><dd><span class="pm-num">10</span></dd></div><div><dt data-i18n="pm_f_link">ვიდეოკავშირი (ღია მინდორზე)</dt><dd><span class="pm-num">2</span> <span class="pm-unit" data-i18n="u_km">კმ</span></dd></div></dl></article>
    <p class="small-note pm-note" data-i18n="pm_notes">* შარდოვანით/კომპლექსური სასუქით ტესტირებისას; დამოკიდებულია გრანულის ზომასა და სიმკვრივეზე. ტვირთი დამოკიდებულია კონფიგურაციაზე. მაქსიმალური მაჩვენებლები მწარმოებლის მონაცემებია — მინდორზე შედეგი დამოკიდებულია ამინდზე, ნაკვეთსა და კონფიგურაციაზე. წყარო: XAG-ის ოფიციალური მახასიათებლები.</p>

<section class="section faq-section" id="faq" aria-labelledby="pfaq-title"><div class="container faq-layout">
<h2 id="pfaq-title" data-i18n="pf_title">ხშირი კითხვები XAG P150 MAX-ის შესახებ</h2><div class="faq-list">
<details class="faq-item"><summary data-i18n="pf_q1">რა არის აგროდრონი და რა სამუშაოებს ასრულებს XAG P150 MAX?</summary><p data-i18n="pf_a1">აგროდრონი არის სასოფლო-სამეურნეო დრონი, რომელიც მინდორზე მუშაობს მარშრუტით. XAG P150 MAX ადგენს ნაკვეთის რუკას (ერთ ფრენაზე 30 ჰა-მდე), ასრულებს შეწამვლას, ფანტავს გრანულებს (RevoCast 5, იყიდება ცალკე) და გადააქვს ტვირთი 80 კგ-მდე (RevoSling, იყიდება ცალკე).</p></details>
<details class="faq-item"><summary data-i18n="pf_q2">სად შეიძლება XAG P150 MAX-ის შეძენა საქართველოში?</summary><p data-i18n="pf_a2">Premium Drones Georgia არის XAG-ის ოფიციალური და ერთადერთი დილერი კავკასიის რეგიონში. პლატფორმა, კომპლექტები და ნაწილები საწყობშია, ფასები ჩანს მაღაზიაში. საწყობი და სერვისი თბილისშია, წინასწარი შეთანხმებით.</p></details>
<details class="faq-item"><summary data-i18n="pf_q3">რა განსხვავებაა Starter, Pro და Business კომპლექტებს შორის?</summary><p data-i18n="pf_a3">Starter-ში შედის დრონი, SRC5 პულტი, 4 აკუმულატორი, 2 დამტენი და 2 გამაგრილებელი ავზი. Pro-ში დამატებულია 2 აკუმულატორი (სულ 6) და XRTK7 RTK სადგური. Business-ში 8 აკუმულატორი და 4 დამტენია. შემადგენლობა და ფასები იხილეთ ზემოთ.</p></details>

<template data-page="choosing-a-drone.html" data-title="article_title_1" data-description="article_1_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_1">გზამკვლევი</p><h1 data-i18n="article_title_1">როგორ შევარჩიოთ სასოფლო-სამეურნეო დრონი</h1><p class="page-intro" data-i18n="article_1_intro">დაიწყეთ სამუშაოს მოთხოვნებით — შემდეგ შეარჩიეთ ტექნიკა.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/p150-max-flight.webp" width="2048" height="853" alt="XAG P150 MAX ფრენისას" data-i18n-alt="hero_alt"><div class="article-body">
    <h2 data-i18n="article_1_h1">თქვენი ნაკვეთი და კულტურა</h2><p data-i18n="article_1_p1">შეაფასეთ დასამუშავებელი ფართობი, ნაკვეთის ფორმა, რელიეფი და მისასვლელი გზა. ღია მინდორი, ვენახი და ბაღი განსხვავებულ დაგეგმვას მოითხოვს. სამუშაო დატვირთვა მხოლოდ ჰექტრების რაოდენობით არ განისაზღვრება.</p>
    <h2 data-i18n="article_1_h2">მთელი სამუშაო პროცესი</h2><p data-i18n="article_1_p2">დრონთან ერთად დაგეგმეთ დამუხტვა, წყლის მიწოდება, ტრანსპორტირება და სამუშაო ჯგუფი. აკუმულატორებისა და დამტენების რაოდენობა უნდა შეესაბამებოდეს რეალურ სამუშაო რეჟიმს.</p>
    <h2 data-i18n="article_1_h3">სერვისი და ნაწილები</h2><p data-i18n="article_1_p3">შეძენამდე გაარკვიეთ, როგორ მიიღებთ ტექნიკურ მხარდაჭერას, რომელი ნაწილებია ხელმისაწვდომი და რას მოიცავს სწავლება. შეადარეთ სრული კომპლექტაციისა და ექსპლუატაციის ხარჯი.</p>
    <h2 data-i18n="article_1_h4">პრაქტიკული დემონსტრაცია</h2><p data-i18n="article_1_p4">კონსულტაციისას აღწერეთ თქვენი კულტურა, ფართობი და სამუშაო ამოცანა. მოითხოვეთ პირობებზე მორგებული შეთავაზება და გადაამოწმეთ დრონის შესაძლებლობები მწარმოებლის დოკუმენტაციით.</p>

<template data-page="first-flight.html" data-title="article_title_2" data-description="article_2_intro">

  <article class="container article-layout"><img src="/assets/img/field-ready.webp" width="1280" height="600" alt="სამუშაოდ მომზადებული დრონი სიმინდის ნაკვეთთან" data-i18n-alt="photo_field"><div class="article-body">
    <h2 data-i18n="article_2_h1">გაიცანით თქვენი ტექნიკა</h2><p data-i18n="article_2_p1">გაიარეთ მოდელზე მორგებული პრაქტიკული სწავლება და წაიკითხეთ მწარმოებლის სახელმძღვანელო. წინასწარ გაეცანით მართვის რეჟიმებს, გაფრთხილებებსა და ფრენის შეწყვეტის პროცედურებს.</p>
    <h2 data-i18n="article_2_h2">შეამოწმეთ დრონი</h2><p data-i18n="article_2_p2">მწარმოებლის საკონტროლო სიის მიხედვით შეამოწმეთ ჩარჩო, პროპელერები, აკუმულატორები და შეწამვლის სისტემა. გაუმართავი ან გაფრთხილების მქონე ტექნიკით ფრენა არ დაიწყოთ.</p>
    <h2 data-i18n="article_2_h3">დაათვალიერეთ სამუშაო ადგილი</h2><p data-i18n="article_2_p3">გამოავლინეთ დაბრკოლებები, ელექტროგადამცემი ხაზები და ადამიანების გადაადგილების ზონები. შეაფასეთ ამინდი და სამუშაოს შესაბამისობა მწარმოებლის შეზღუდვებთან და მოქმედ მოთხოვნებთან.</p>
    <h2 data-i18n="article_2_h4">დაგეგმეთ დამუშავება</h2><p data-i18n="article_2_p4">პრეპარატი და გამოყენების ნორმა შეარჩიეთ აგრონომთან და პროდუქტის ეტიკეტის მიხედვით. სწავლებისას შეამოწმეთ სამუშაო პარამეტრები მწარმოებლის ინსტრუქციით. ეს გზამკვლევი პრაქტიკულ სწავლებას არ ცვლის.</p>

      <p data-i18n="about_xag_p1">XAG — სასოფლო-სამეურნეო დრონებისა და რობოტების წარმოების მსოფლიო ლიდერი. მისი გუნდი 2007–2008 წლებში ჩამოყალიბდა და დღეს ქმნის სასოფლო-სამეურნეო დრონებს, როვერებს, ტრაქტორის ავტოპილოტს და „ჭკვიანი ფერმის“ მოწყობილობებს. XAG-ის მონაცემებით, კომპანია ამ სფეროში ყველაზე მეტი პატენტის მფლობელია.</p>

          <details class="faq-item"><summary data-i18n="faq_q1">რა არის შესაწამლი დრონი?</summary><p data-i18n="faq_a1">შესაწამლი დრონი არის სასოფლო-სამეურნეო დრონი, რომელიც ავტომატურად, GPS/RTK მარშრუტით წამლავს ნაკვეთს მცენარეთა დაცვის საშუალებებით. დამატებითი მოდულებით (RevoCast 5, RevoSling) XAG P150 MAX გრანულებსაც აფანტავს და ტვირთსაც გადაიტანს.</p></details>

          <details class="faq-item"><summary data-i18n="faq_q7">შეუძლია თუ არა P150 MAX-ს გრანულების გაფანტვა?</summary><p data-i18n="faq_a7">დიახ. RevoCast 5 მოდულით (იყიდება ცალკე) და 115-ლიტრიანი კონტეინერით P150 MAX აფანტავს გრანულირებულ სასუქს, თესლს და სხვა გრანულებს. მახასიათებლები იხილეთ P150 MAX-ის გვერდზე.</p></details>

<template data-page="batteries-and-charging.html" data-title="article_title_3" data-description="article_3_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_1">გზამკვლევი</p><h1 data-i18n="article_title_3">ბატარეები და დამუხტვა</h1><p class="page-intro" data-i18n="article_3_intro">აკუმულატორების რაოდენობა, დამუხტვა და მოვლა განსაზღვრავს, რამდენს იმუშავებს დრონი დღეში.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/battery.webp" width="960" height="1280" alt="XAG-ის აკუმულატორი ნაკვეთზე" data-i18n-alt="photo_battery"><div class="article-body">
    <h2 data-i18n="article_3_h1">რამდენი აკუმულატორი გჭირდებათ</h2><p data-i18n="article_3_p1">დრონი ფრენს, სანამ შემდეგი აკუმულატორი იმუხტება. ფრენისა და დამუხტვის დრო ერთმანეთს უნდა დაემთხვეს, ამიტომ დიდ ფართობზე მეტი აკუმულატორი და დამტენი გჭირდებათ. სწორ რაოდენობას თქვენი ფართობისა და სამუშაო დღის მიხედვით ერთად შევარჩევთ.</p><h2 data-i18n="article_3_h2">ენერგია მინდორზე</h2><p data-i18n="article_3_p2">მინდორზე ელექტროენერგია ყოველთვის არ არის. გენერატორი და პარალელური დამუხტვის კომპლექტი საშუალებას გაძლევთ, დატენოთ იქ, სადაც მუშაობთ. გამოიყენეთ მწარმოებლის მიერ რეკომენდებული აღჭურვილობა.</p><h2 data-i18n="article_3_h3">გაგრილება და ტემპერატურა</h2><p data-i18n="article_3_p3">ცხელ დღეს აკუმულატორი ფრენის შემდეგ თბება. დამუხტვამდე გააგრილეთ, მაგალითად გამაგრილებელი ავზით. ცხელი აკუმულატორის დამუხტვა მის სიცოცხლეს ამცირებს.</p><h2 data-i18n="article_3_h4">შენახვა სეზონებს შორის</h2><p data-i18n="article_3_p4">სეზონის შემდეგ აკუმულატორები შეინახეთ მშრალ, გრილ ადგილას, მწარმოებლის მიერ მითითებული დატენვის დონით. დაზიანებული ან გაბერილი აკუმულატორი აღარ გამოიყენოთ.</p>

<template data-page="service-and-parts.html" data-title="article_title_4" data-description="article_4_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_2">პრაქტიკა</p><h1 data-i18n="article_title_4">სერვისი და ნაწილები</h1><p class="page-intro" data-i18n="article_4_intro">სეზონში ერთი დღის გაჩერებაც ძვირი ჯდება. სერვისი და ნაწილები ადგილზე ამ დროს ამცირებს.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/drone-detail.webp" width="1280" height="960" alt="XAG-ის დრონის ტექნიკური დეტალები" data-i18n-alt="photo_detail"><div class="article-body">
    <h2 data-i18n="article_4_h1">სეზონამდე შემოწმება</h2><p data-i18n="article_4_p1">სეზონის დაწყებამდე შეამოწმეთ ძრავები, პროპელერები, ტუმბოები, საქშენები და კაბელები. დროულად აღმოჩენილი მცირე ხარვეზი მინდორზე დიდ გაჩერებას გადაგარჩენთ.</p><h2 data-i18n="article_4_h2">ორიგინალი ნაწილები</h2><p data-i18n="article_4_p2">არაორიგინალმა ნაწილმა შეიძლება შეცვალოს დრონის მუშაობა და უსაფრთხოება. P150 MAX-ისთვის XAG-ის ორიგინალი ნაწილები ჩვენს საწყობშია საქართველოში.</p><h2 data-i18n="article_4_h3">რეგულარული მოვლა</h2><p data-i18n="article_4_p3">ყოველი სამუშაო დღის შემდეგ გარეცხეთ შეწამვლის სისტემა და დაათვალიერეთ დრონი. მოვლის წესები იხილეთ მწარმოებლის სახელმძღვანელოში ან ჰკითხეთ ჩვენს გუნდს.</p><h2 data-i18n="article_4_h4">როცა რამე არასწორად მუშაობს</h2><p data-i18n="article_4_p4">თუ დრონი გაფრთხილებას აჩვენებს ან უცნაურად იქცევა, შეწყვიტეთ ფრენა და დაგვიკავშირდით. დიაგნოსტიკასა და შეკეთებას თავად ვაკეთებთ.</p>
