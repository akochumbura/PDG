  <section class="section pm-chapters" id="capabilities" aria-label="შესაძლებლობები" data-i18n-aria="pm_chapters_label"><div class="container">
    <article class="pm-chapter" id="map" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>01</span> RealTerra</p><h2 data-i18n="pm_map_t">რუკის შედგენა</h2><p data-i18n="pm_map_p">ჩაშენებული სისტემა, დამატებითი მოდულის გარეშე: ავტონომიური ფრენისას იღებს მაღალი გარჩევადობის ფოტოებს, აერთიანებს ნაკვეთის რუკად და დაჯდომისთანავე გაძლევთ. ხელოვნური ინტელექტი თავად ცნობს დაბრკოლებებს, მთიან რელიეფზე ჩანს 3D მოდელი, ხოლო პრესკრიფციული რუკებით შესაძლებელია ცვლადი ნორმით შეწამვლა და გაფანტვა.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_map">რუკა ერთ ფრენაზე</dt><dd><span class="pm-num">30</span> <span class="pm-unit" data-i18n="u_ha">ჰა</span></dd></div><div><dt data-i18n="pm_f_3d">მოდელი მთიანი რელიეფისთვის</dt><dd><span class="pm-num">3D</span></dd></div><div><dt data-i18n="pm_f_vra">ცვლადი ნორმა რუკით</dt><dd><span class="pm-num">VRA</span></dd></div></dl></article>
    <article class="pm-chapter" id="spray" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>02</span> RevoSpray 5</p><h2 data-i18n="pm_spray_t">შეწამვლა</h2><p data-i18n="pm_spray_p">ინტელექტუალური ცენტრიდანული საქშენები და ორი მოქნილი ტუმბო ზუსტად ანაწილებს ხსნარს. ოთხი როტორის ძლიერი ჰაერის ნაკადი წვეთებს ხშირ ვარჯში ატარებს. დამატებითი 4 საქშენის განახლების კომპლექტით ხარჯი 46 ლ/წთ-მდე იზრდება — რეკომენდებულია ბაღებისა და ვენახებისთვის.</p><p class="pm-more"><a class="text-link" href="/shop?q=05-002-02640#parts" data-local data-i18n="pm_nozzle_link">4 საქშენის განახლების კომპლექტი მაღაზიაში →</a></p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_tank">ხსნარის ავზი</dt><dd><span class="pm-num">80</span> <span class="pm-unit" data-i18n="u_l">ლ</span></dd></div><div><dt data-i18n="pm_f_flow">ხარჯი, ორი ტუმბო</dt><dd><span class="pm-num">32</span> <span class="pm-unit" data-i18n="u_lmin">ლ/წთ</span></dd></div><div><dt data-i18n="pm_f_flow4">4 საქშენის კომპლექტით</dt><dd><span class="pm-num">46</span> <span class="pm-unit" data-i18n="u_lmin">ლ/წთ</span></dd></div><div><dt data-i18n="pm_f_drop">წვეთის ზომა</dt><dd><span class="pm-num">60–1500</span> <span class="pm-unit" data-i18n="u_um">მკმ</span></dd></div><div><dt data-i18n="pm_f_swath">შეწამვლის სიგანე</dt><dd><span class="pm-num">5–10</span> <span class="pm-unit" data-i18n="u_m">მ</span></dd></div></dl></article>
    <article class="pm-chapter" id="spread" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>03</span> RevoCast 5</p><h2 data-i18n="pm_spread_t">გრანულების გაფანტვა</h2><p data-i18n="pm_spread_p">ვერტიკალური რხევითი გამფანტველი პირდაპირი ამძრავით ქარშიც თანაბრად ანაწილებს მასალას. სამი ზომის ხრახნიანი მიმწოდებელი იღებს 10 მმ-მდე გრანულებს: სასუქს, თესლს, საკვებს. კონტეინერი ორივე მხრიდან ივსება.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_hopper">გრანულების კონტეინერი</dt><dd><span class="pm-num">115</span> <span class="pm-unit" data-i18n="u_l">ლ</span></dd></div><div><dt data-i18n="pm_f_rate">მაქს. გაფანტვა*</dt><dd><span class="pm-num">300</span> <span class="pm-unit" data-i18n="u_kgmin">კგ/წთ</span></dd></div><div><dt data-i18n="pm_f_spw">ეფექტური სიგანე</dt><dd><span class="pm-num">9</span> <span class="pm-unit" data-i18n="u_m">მ</span></dd></div><div><dt data-i18n="pm_f_gran">მაქს. გრანულა</dt><dd><span class="pm-num">10</span> <span class="pm-unit" data-i18n="u_mm">მმ</span></dd></div></dl></article>
    <article class="pm-chapter" id="cargo" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>04</span> RevoSling</p><h2 data-i18n="pm_cargo_t">ტვირთის გადატანა</h2><p data-i18n="pm_cargo_p">სასოფლო-სამეურნეო მასალის, მოსავლის, ჩითილებისა და ნერგების მიტანა ძნელად მისადგომ ადგილებში. ტვირთის საიმედო საკეტი ავტომატური გაშვებით, A/B მარშრუტი, ინდივიდუალური ტრასა მთიან რელიეფზე და წონის გაზომვა ფრენისას.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_payload">მაქს. ტვირთი</dt><dd><span class="pm-num">80</span> <span class="pm-unit" data-i18n="u_kg">კგ</span></dd></div><div><dt data-i18n="pm_f_slingspeed">მაქს. სიჩქარე ტვირთით</dt><dd><span class="pm-num">13.8</span> <span class="pm-unit" data-i18n="u_ms">მ/წმ</span></dd></div></dl></article>
    <article class="pm-chapter" id="flight" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>05</span> SuperX 5 Ultra</p><h2 data-i18n="pm_flight_t">ფრენა და უსაფრთხოება</h2><p data-i18n="pm_flight_p">4D გამოსახულების რადარი დღისით და ღამით ხედავს ბოძებს, მავთულებს, მორწყვის დანადგარებს და სხვა დაბრკოლებებს. რელიეფის მიყოლა წინასწარი რუკის გარეშე — დრონი 3D რუკას ფრენისას აგებს. ფართოკუთხიანი FPV კამერა დაბრკოლებებს AR ნიშნებით აჩვენებს და საეჭვო სიტუაციაში დრონი ჰაერში ჩერდება.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_s_speed">მაქს. სამუშაო სიჩქარე</dt><dd><span class="pm-num">20</span> <span class="pm-unit" data-i18n="u_ms">მ/წმ</span></dd></div><div><dt data-i18n="pm_f_radar">რადარის მანძილი</dt><dd><span class="pm-num">1.5–100</span> <span class="pm-unit" data-i18n="u_m">მ</span></dd></div><div><dt data-i18n="pm_f_cpu">გამოთვლითი სიმძლავრე SuperX 5 Pro-სთან შედარებით</dt><dd><span class="pm-num">2.5×</span></dd></div></dl></article>
    <article class="pm-chapter" id="power" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>06</span> B141050 · CM13600S · GC4000+</p><h2 data-i18n="pm_power_t">ენერგია და დამუხტვა</h2><p data-i18n="pm_power_p">1050 ვტ·სთ აკუმულატორი 1500 ციკლამდე (გარანტია — 1 წელი ან 1500 ციკლი). ერთი CM13600S დამტენით 30%-დან 95%-მდე დაახლოებით 12 წუთში, პარალელური კომპლექტით — 7 წუთში. ნისლით გამაგრილებელი ავზი ერთი ავზით 6–8 საათს მუშაობს, ხოლო GC4000+ გენერატორი ველზე დამოუკიდებლად გამუშავებთ. ერთი აკუმულატორის რეჟიმი: 50 ლ ხსნარი ან 40 კგ გრანულა.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_f_wh">აკუმულატორის ტევადობა</dt><dd><span class="pm-num">1050</span> <span class="pm-unit" data-i18n="u_wh">ვტ·სთ</span></dd></div><div><dt data-i18n="pm_f_cycles">ციკლი</dt><dd><span class="pm-num">1500</span></dd></div><div><dt data-i18n="pm_f_charge">დამუხტვა 30→95%, პარალელურად</dt><dd><span class="pm-num">7</span> <span class="pm-unit" data-i18n="u_min">წთ</span></dd></div><div><dt data-i18n="pm_f_kw">დამტენის სიმძლავრე</dt><dd><span class="pm-num">3.4</span> <span class="pm-unit" data-i18n="u_kw">კვტ</span></dd></div></dl></article>
    <article class="pm-chapter" id="build" data-reveal><div class="pm-chapter-text"><p class="pm-index"><span>07</span> XAG One · SRC 5 · XRTK 7</p><h2 data-i18n="pm_build_t">კონსტრუქცია და მართვა</h2><p data-i18n="pm_build_p">IPX6K დაცვა — დრონი წყლით ირეცხება. 63-დიუმიანი პროპელერები, დასაკეცი მკლავები და მოდულური კონსტრუქცია ტრანსპორტირებისთვის. XAG One აპლიკაციაში: მარშრუტი ნაკვეთის ფორმით, 10-მდე ნაკვეთი ერთ მისიაში, ორი დრონის ერთდროული მართვა და ავტომატური დაბრუნება, როცა ხსნარი ან ენერგია მთავრდება. SRC 5 პულტი: 7 დიუმიანი კაშკაშა ეკრანი, 8 საათი მუშაობა. სანტიმეტრული სიზუსტისთვის — XRTK 7 მობილური სადგური.</p></div><dl class="pm-figs"><div><dt data-i18n="pm_f_ip">დაცვის კლასი</dt><dd><span class="pm-num">IPX6K</span></dd></div><div><dt data-i18n="pm_f_prop">პროპელერი</dt><dd><span class="pm-num">63</span> <span class="pm-unit" data-i18n="u_in">დიუმი</span></dd></div><div><dt data-i18n="pm_f_fields">ნაკვეთი ერთ მისიაში</dt><dd><span class="pm-num">10</span></dd></div><div><dt data-i18n="pm_f_link">ვიდეოკავშირი (ღია ველზე)</dt><dd><span class="pm-num">2</span> <span class="pm-unit" data-i18n="u_km">კმ</span></dd></div></dl></article>
    <p class="small-note pm-note" data-i18n="pm_notes">* შარდოვანით/კომპლექსური სასუქით ტესტირებისას; დამოკიდებულია გრანულის ზომასა და სიმკვრივეზე. ტვირთი დამოკიდებულია კონფიგურაციაზე. წყარო: XAG-ის ოფიციალური მახასიათებლები.</p>

<template data-page="choosing-a-drone.html" data-title="article_title_1" data-description="article_1_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_1">გზამკვლევი</p><h1 data-i18n="article_title_1">როგორ შევარჩიოთ სასოფლო-სამეურნეო დრონი</h1><p class="page-intro" data-i18n="article_1_intro">დაიწყეთ სამუშაოს მოთხოვნებით — შემდეგ შეარჩიეთ ტექნიკა.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/p150-max-flight.webp" width="2048" height="853" alt="XAG P150 MAX ფრენისას" data-i18n-alt="hero_alt"><div class="article-body">
    <h2 data-i18n="article_1_h1">თქვენი ნაკვეთი და კულტურა</h2><p data-i18n="article_1_p1">შეაფასეთ დასამუშავებელი ფართობი, ნაკვეთის ფორმა, რელიეფი და მისასვლელი გზა. ღია ველი, ვენახი და ბაღი განსხვავებულ დაგეგმვას მოითხოვს. სამუშაო დატვირთვა მხოლოდ ჰექტრების რაოდენობით არ განისაზღვრება.</p>
    <h2 data-i18n="article_1_h2">მთელი სამუშაო პროცესი</h2><p data-i18n="article_1_p2">დრონთან ერთად დაგეგმეთ დამუხტვა, წყლის მიწოდება, ტრანსპორტირება და სამუშაო ჯგუფი. აკუმულატორებისა და დამტენების რაოდენობა უნდა შეესაბამებოდეს რეალურ სამუშაო რეჟიმს.</p>
    <h2 data-i18n="article_1_h3">სერვისი და ნაწილები</h2><p data-i18n="article_1_p3">შეძენამდე გაარკვიეთ, როგორ მიიღებთ ტექნიკურ მხარდაჭერას, რომელი ნაწილებია ხელმისაწვდომი და რას მოიცავს სწავლება. შეადარეთ სრული კომპლექტაციისა და ექსპლუატაციის ხარჯი.</p>
    <h2 data-i18n="article_1_h4">პრაქტიკული დემონსტრაცია</h2><p data-i18n="article_1_p4">კონსულტაციისას აღწერეთ თქვენი კულტურა, ფართობი და სამუშაო ამოცანა. მოითხოვეთ პირობებზე მორგებული შეთავაზება და გადაამოწმეთ დრონის შესაძლებლობები მწარმოებლის დოკუმენტაციით.</p>

<template data-page="first-flight.html" data-title="article_title_2" data-description="article_2_intro">
  <section class="page-hero"><div class="container"><a class="back-link" href="/blog.html" data-local data-i18n="back_blog">← ბლოგი</a><p class="eyebrow" data-i18n="article_category_2">პრაქტიკა</p><h1 data-i18n="article_title_2">როგორ მოვემზადოთ პირველი ფრენისთვის</h1><p class="page-intro" data-i18n="article_2_intro">სწავლება, ტექნიკური შემოწმება და სამუშაოს დაგეგმვა.</p></div></section>
  <article class="container article-layout"><img src="/assets/img/field-ready.webp" width="1280" height="600" alt="სამუშაოდ მომზადებული დრონი სიმინდის ნაკვეთთან" data-i18n-alt="photo_field"><div class="article-body">
    <h2 data-i18n="article_2_h1">გაიცანით თქვენი ტექნიკა</h2><p data-i18n="article_2_p1">გაიარეთ მოდელზე მორგებული პრაქტიკული სწავლება და წაიკითხეთ მწარმოებლის სახელმძღვანელო. წინასწარ გაეცანით მართვის რეჟიმებს, გაფრთხილებებსა და ფრენის შეწყვეტის პროცედურებს.</p>
    <h2 data-i18n="article_2_h2">შეამოწმეთ დრონი</h2><p data-i18n="article_2_p2">მწარმოებლის საკონტროლო სიის მიხედვით შეამოწმეთ ჩარჩო, პროპელერები, აკუმულატორები და შეწამვლის სისტემა. გაუმართავი ან გაფრთხილების მქონე ტექნიკით ფრენა არ დაიწყოთ.</p>
    <h2 data-i18n="article_2_h3">დაათვალიერეთ სამუშაო ადგილი</h2><p data-i18n="article_2_p3">გამოავლინეთ დაბრკოლებები, ელექტროგადამცემი ხაზები და ადამიანების გადაადგილების ზონები. შეაფასეთ ამინდი და სამუშაოს შესაბამისობა მწარმოებლის შეზღუდვებთან და მოქმედ მოთხოვნებთან.</p>
    <h2 data-i18n="article_2_h4">დაგეგმეთ დამუშავება</h2><p data-i18n="article_2_p4">პრეპარატი და გამოყენების ნორმა შეარჩიეთ აგრონომთან და პროდუქტის ეტიკეტის მიხედვით. სწავლებისას შეამოწმეთ სამუშაო პარამეტრები მწარმოებლის ინსტრუქციით. ეს გზამკვლევი პრაქტიკულ სწავლებას არ ცვლის.</p>

  </div></article>
</template>

  <section class="section"><div class="container about-story">

      <h2 data-i18n="about_story_title">რეალური საველე სამუშაოდან.</h2>
      <p data-i18n="about_story_1">PDG-ს გამოცდილება დაიწყო რეალური საველე სამუშაოდან. ჩვენ ვიმუშავეთ XAG V40, P100 და P100 Pro პლატფორმებთან ქართულ პირობებში და პრაქტიკაში გავიარეთ ბატარეების, დამუხტვის, ნაწილების, სერვისისა და ოპერატორის მომზადების ყველა მთავარი საკითხი. დღეს ჩვენი მიზანია XAG ეკოსისტემის განვითარება საქართველოში და კავკასიის რეგიონში.</p>
      <p data-i18n="about_story_2">საწყობი და სერვისის მხარდაჭერა თბილისში. საველე გამოცდილება და ოპერაციები ლაგოდეხიდან.</p>
      <p data-i18n="about_story_3">დღეს ჩვენი მთავარი ფოკუსია XAG P150 MAX. გთავაზობთ XAG-ის სრულ ეკოსისტემას: დრონები, ბატარეები, დამტენები, გენერატორები, ნაწილები, სერვისი და სწავლება — ფერმერებისთვის, მომსახურე კომპანიებისა და სახელმწიფო და მუნიციპალური შემსყიდველებისთვის.</p>

      <p data-i18n="about_xag_p2">კომპანიის მიზანია, ავტონომიური ტექნოლოგიებით მიწათმოქმედება უფრო ეფექტიანი, მდგრადი და მომგებიანი გახადოს. საქართველოში XAG-ის ტექნიკას, ნაწილებს, სერვისსა და სწავლებას PDG გთავაზობთ.</p>

          <details class="faq-item"><summary data-i18n="faq_q1">რა არის შესაწამლი დრონი?</summary><p data-i18n="faq_a1">შესაწამლი დრონი არის სასოფლო-სამეურნეო დრონი, რომელიც ავტომატურად, GPS/RTK მარშრუტით წამლავს ნაკვეთს მცენარეთა დაცვის საშუალებებით. XAG P150 MAX ამასთან ერთად აფანტავს გრანულებს და გადააქვს ტვირთი.</p></details>

<template data-page="batteries-and-charging.html" data-title="article_title_3" data-description="article_3_intro">

    <h2 data-i18n="article_3_h1">რამდენი აკუმულატორი გჭირდებათ</h2><p data-i18n="article_3_p1">დრონი ფრენს, სანამ შემდეგი აკუმულატორი იმუხტება. ფრენისა და დამუხტვის დრო ერთმანეთს უნდა დაემთხვეს, ამიტომ დიდ ფართობზე მეტი აკუმულატორი და დამტენი გჭირდებათ. სწორ რაოდენობას თქვენი ფართობისა და სამუშაო დღის მიხედვით ერთად შევარჩევთ.</p><h2 data-i18n="article_3_h2">ენერგია ველზე</h2><p data-i18n="article_3_p2">ველზე ელექტროენერგია ყოველთვის არ არის. გენერატორი და პარალელური დამუხტვის კომპლექტი საშუალებას გაძლევთ, დატენოთ იქ, სადაც მუშაობთ. გამოიყენეთ მწარმოებლის მიერ რეკომენდებული აღჭურვილობა.</p><h2 data-i18n="article_3_h3">გაგრილება და ტემპერატურა</h2><p data-i18n="article_3_p3">ცხელ დღეს აკუმულატორი ფრენის შემდეგ თბება. დამუხტვამდე გააგრილეთ, მაგალითად გამაგრილებელი ავზით. ცხელი აკუმულატორის დამუხტვა მის სიცოცხლეს ამცირებს.</p><h2 data-i18n="article_3_h4">შენახვა სეზონებს შორის</h2><p data-i18n="article_3_p4">სეზონის შემდეგ აკუმულატორები შეინახეთ მშრალ, გრილ ადგილას, მწარმოებლის მიერ მითითებული დატენვის დონით. დაზიანებული ან გაბერილი აკუმულატორი აღარ გამოიყენოთ.</p>
